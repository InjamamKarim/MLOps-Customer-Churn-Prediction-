stages:
  prepare:
    cmd: python -m src.data
    deps:
      - src/data.py
      - data/raw/Telco-Customer-Churn.csv
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - model.n_estimators
      - model.max_depth
    outs:
      - models/model.pkl
